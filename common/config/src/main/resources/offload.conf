# Per-operator offloading to elastic cloud compute.
#
# An offloaded operator runs alone on a rented instance sized for its peak
# memory. The catalog below is the set of instances the platform may rent.
offload {
  # Master switch. Off by default: offloading rents billable resources.
  enabled = false
  enabled = ${?OFFLOAD_ENABLED}

  # Which provisioner rents the instance.
  #   docker - a memory-capped Docker container on the local machine, a free
  #            stand-in that reproduces real OOM-kill behaviour for JVM and
  #            Python operators alike (kernel cgroup limit, not just -Xmx)
  #   ec2    - an Amazon EC2 virtual machine (not yet implemented)
  provider = "docker"
  provider = ${?OFFLOAD_PROVIDER}

  # Default docker image the worker container runs, used by every offloaded
  # operator that does not name one of its own. An operator may override it in
  # the property panel to bring its own tooling; either way the image's entry
  # point must launch the Texera worker, since a rented instance becomes usable
  # only by joining the Pekko cluster.
  #
  # Note that the override is the workflow author's to set, so enabling offload
  # lets anyone who can edit a workflow have this host's docker daemon pull and
  # run an image of their choosing. There is no registry allowlist.
  docker-image = "texera-computing-unit-worker:latest"
  docker-image = ${?OFFLOAD_DOCKER_IMAGE}

  # Path or name of the docker executable used to launch worker containers.
  docker-binary = "docker"
  docker-binary = ${?OFFLOAD_DOCKER_BINARY}

  # Docker network the worker container joins.
  #
  # A worker must be able to dial the coordinator's Pekko port, and the
  # coordinator must be able to dial the worker's. The two defaults that work
  # out of the box:
  #
  #   "host"  - the container shares the host's network namespace, so both
  #             directions resolve over localhost. Simplest, and the default
  #             because it needs no address discovery at all. Linux and Docker
  #             Desktop on macOS 4.34+ ("Enable host networking").
  #   <name>  - a user-defined bridge network (e.g. "texera-single-node") when
  #             the coordinator itself runs in a container on that network;
  #             containers reach each other by name.
  #
  # With "host", worker-advertised-hostname should stay "localhost". On a bridge
  # network, set it to the container's own name/alias.
  docker-network = "host"
  docker-network = ${?OFFLOAD_DOCKER_NETWORK}

  # Hostname the coordinator advertises to worker containers.
  #
  # Only used when docker-network is NOT "host": a container's "localhost" is
  # itself, so the coordinator must advertise a name the container can route to.
  #   - coordinator native on macOS/Windows: "host.docker.internal"
  #   - coordinator native on Linux:         "172.17.0.1" (docker0 gateway)
  #   - coordinator in a container:          its container/service name
  coordinator-advertised-hostname = "host.docker.internal"
  coordinator-advertised-hostname = ${?OFFLOAD_COORDINATOR_ADVERTISED_HOSTNAME}

  # Fixed Pekko port for worker containers, so the coordinator can reach them at
  # a predictable address. Each concurrently-rented worker needs its own port;
  # this is the base and the provider allocates upward from it.
  worker-pekko-base-port = 2560
  worker-pekko-base-port = ${?OFFLOAD_WORKER_PEKKO_BASE_PORT}

  # Upper bound on how long a rented instance may live, in minutes. A rented
  # instance is billed until it is released, so this cap bounds the cost of a
  # crashed or abandoned execution.
  max-instance-lifetime-minutes = 60
  max-instance-lifetime-minutes = ${?OFFLOAD_MAX_INSTANCE_LIFETIME_MINUTES}

  # How long to wait for a rented instance to join the Pekko cluster before
  # giving up and releasing it.
  join-timeout-seconds = 300
  join-timeout-seconds = ${?OFFLOAD_JOIN_TIMEOUT_SECONDS}

  # How often, in milliseconds, to re-check cluster membership while waiting for
  # a rented instance to join.
  join-poll-interval-ms = 1000
  join-poll-interval-ms = ${?OFFLOAD_JOIN_POLL_INTERVAL_MS}

  # Headroom multiplier applied to an estimated peak memory before choosing an
  # instance. Used when an operator does not override it.
  default-safety-factor = 1.25
  default-safety-factor = ${?OFFLOAD_DEFAULT_SAFETY_FACTOR}

  # Instances the platform may rent, cheapest-fitting-first at selection time.
  #
  # price-per-hour is in USD and is used only to rank candidates, so approximate
  # values still yield the correct choice. The local-container entries are free
  # and exist so the local provider can be exercised without cloud spend.
  #
  # EC2 on-demand, us-east-1, as of 2025-06; refresh before reporting costs.
  instances = [
    { name = "local-1g",    vcpu = 1, memory-gib = 1,   price-per-hour = 0.0 },
    { name = "local-2g",    vcpu = 2, memory-gib = 2,   price-per-hour = 0.0 },
    { name = "local-4g",    vcpu = 2, memory-gib = 4,   price-per-hour = 0.0 },
    { name = "local-8g",    vcpu = 4, memory-gib = 8,   price-per-hour = 0.0 },

    { name = "t3.small",    vcpu = 2, memory-gib = 2,   price-per-hour = 0.0208 },
    { name = "t3.medium",   vcpu = 2, memory-gib = 4,   price-per-hour = 0.0416 },
    { name = "t3.large",    vcpu = 2, memory-gib = 8,   price-per-hour = 0.0832 },
    { name = "t3.xlarge",   vcpu = 4, memory-gib = 16,  price-per-hour = 0.1664 },
    { name = "t3.2xlarge",  vcpu = 8, memory-gib = 32,  price-per-hour = 0.3328 },

    { name = "m5.large",    vcpu = 2, memory-gib = 8,   price-per-hour = 0.096 },
    { name = "m5.xlarge",   vcpu = 4, memory-gib = 16,  price-per-hour = 0.192 },
    { name = "m5.2xlarge",  vcpu = 8, memory-gib = 32,  price-per-hour = 0.384 },
    { name = "m5.4xlarge",  vcpu = 16, memory-gib = 64, price-per-hour = 0.768 },

    { name = "r5.large",    vcpu = 2, memory-gib = 16,  price-per-hour = 0.126 },
    { name = "r5.xlarge",   vcpu = 4, memory-gib = 32,  price-per-hour = 0.252 },
    { name = "r5.2xlarge",  vcpu = 8, memory-gib = 64,  price-per-hour = 0.504 },
    { name = "r5.4xlarge",  vcpu = 16, memory-gib = 128, price-per-hour = 1.008 }
  ]
}
